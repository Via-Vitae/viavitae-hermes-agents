# License-free secret scanning (GitHub Free compensating control).
name: gitleaks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar xzf gitleaks_8.30.1_linux_x64.tar.gz
          ./gitleaks detect --source . --config .gitleaks.toml --verbose --redact --exit-code 1
